<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Soul Sunny Studio</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☀️</text></svg>">
<style>
:root{--bg:#fffdf8;--side:#faf6ec;--text:#2f2a24;--muted:#8a8172;--line:#ece5d6;--hover:#f2ecdf;--accent:#f2a33a;--accent-soft:#fdf0d9;--card:#fff;--code:#f6f2ea;--danger:#d9534f}
@media (prefers-color-scheme:dark){:root{--bg:#1e1c19;--side:#25221e;--text:#ece6dc;--muted:#9c9384;--line:#36322c;--hover:#2f2b26;--accent:#f2a33a;--accent-soft:#3a2f1e;--card:#26231f;--code:#2b2823;--danger:#ff7b72}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
#app{display:flex;min-height:100vh}
#sidebar{width:260px;flex:none;background:var(--side);border-right:1px solid var(--line);height:100vh;position:sticky;top:0;display:flex;flex-direction:column}
.brand{padding:18px 16px 10px;font-weight:700;font-size:16px}
.search{margin:4px 12px 8px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);font:inherit;font-size:14px}
#nav{flex:1;overflow:auto;padding:0 8px 12px}
.nav-item{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;color:var(--text);font:inherit;font-size:14px;padding:5px 8px;border-radius:6px;cursor:pointer;text-align:left}
.nav-item:hover{background:var(--hover)}
.nav-item.active{background:var(--accent-soft);font-weight:600}
.nav-item .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sec{margin-top:14px}
.sec-head{display:flex;justify-content:space-between;align-items:center;padding:0 8px 4px;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.icon-btn{border:0;background:none;color:var(--muted);font-size:17px;line-height:1;width:24px;height:24px;border-radius:6px;cursor:pointer}
.icon-btn:hover{background:var(--hover);color:var(--text)}
.empty-side{font-size:13px;color:var(--muted);padding:2px 8px}
.side-foot{border-top:1px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.side-foot .row{display:flex;gap:6px}
.side-foot .row .btn{flex:1}
.btn{border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-size:14px;padding:6px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#3b2504;font-weight:600}
.btn.primary:hover{filter:brightness(.96)}
.btn.small{font-size:13px;padding:3px 9px}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.ghost:hover{background:var(--hover);color:var(--text)}
.btn.danger:hover{color:var(--danger)}
.muted{color:var(--muted)}
.small{font-size:13px}
#main{flex:1;min-width:0}
.menu-toggle{display:none}
/* home */
.home{max-width:1100px;margin:0 auto;padding:40px 32px 80px}
.home-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.home h1{margin:0;font-size:30px}
.home-head p{margin:4px 0 0}
.new-btns{display:flex;gap:8px;flex-wrap:wrap}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0 18px}
.chip{border:1px solid var(--line);background:none;color:var(--text);font:inherit;font-size:13px;padding:4px 12px;border-radius:999px;cursor:pointer}
.chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.card{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card);color:inherit;text-decoration:none;transition:transform .12s,box-shadow .12s}
.card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.08)}
.card-cover{height:120px;position:relative;display:flex;align-items:center;justify-content:center}
.card-cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card-icon{font-size:38px;position:relative}
.card-cover img+.card-icon{position:absolute;left:10px;bottom:6px;font-size:26px;filter:drop-shadow(0 1px 3px rgba(0,0,0,.4))}
.t-idea{background:linear-gradient(135deg,#ffe7a8,#ffc979)}
.t-site{background:linear-gradient(135deg,#cfe8ff,#a9d1ff)}
.t-app{background:linear-gradient(135deg,#e3d7ff,#c7b5ff)}
.t-note{background:linear-gradient(135deg,#d9f2df,#b5e3c1)}
.card-body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.card-title{font-weight:600;word-break:break-word}
.card-snip{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px;margin-top:auto}
.badge{background:var(--hover);padding:1px 8px;border-radius:999px}
.s-in-progress{background:#fde7c4;color:#7a4b00}
.s-done{background:#d5f0dc;color:#1f6b35}
.s-paused{background:#e8e5df;color:#6b6457}
@media (prefers-color-scheme:dark){
  .t-idea,.t-site,.t-app,.t-note{filter:brightness(.75) saturate(.85)}
  .s-in-progress{background:#4a3612;color:#ffd08a}
  .s-done{background:#1f3d28;color:#9be0ad}
  .s-paused{background:#3a3631;color:#bdb4a6}
}
.empty{padding:60px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}
/* page */
.topbar{display:flex;justify-content:space-between;align-items:center;padding:10px 20px;font-size:14px;gap:12px;position:sticky;top:0;background:var(--bg);z-index:5}
.crumbs{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:var(--muted);display:flex;align-items:center;gap:4px}
.crumbs a{color:var(--muted);text-decoration:none}
.crumbs a:hover{color:var(--text)}
#crumb{color:var(--text);overflow:hidden;text-overflow:ellipsis}
.top-right{display:flex;align-items:center;gap:10px;font-size:13px;flex:none}
.cover{height:220px;position:relative;overflow:hidden}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover-btns{position:absolute;right:20px;bottom:12px;display:flex;gap:6px;opacity:0;transition:opacity .15s}
.cover:hover .cover-btns{opacity:1}
.page{max-width:820px;margin:0 auto;padding:40px 60px 160px}
.page.has-cover{padding-top:0}
.page-icon{font-size:64px;line-height:1;border:0;background:none;cursor:pointer;padding:4px;border-radius:8px;margin:0 0 4px -4px;position:relative}
.page.has-cover .page-icon{margin-top:-40px}
.page.has-cover:not(.has-icon) .head-tools{margin-top:12px}
.page-icon:hover{background:var(--hover)}
.head-tools{display:flex;gap:4px;min-height:30px;opacity:0;transition:opacity .15s;margin-left:-8px}
.page:hover .head-tools,.head-tools:focus-within{opacity:1}
.title{font-size:38px;font-weight:700;line-height:1.2;margin:4px 0 12px;outline:none;word-break:break-word}
[data-ph]:empty::before{content:attr(data-ph);color:var(--muted);opacity:.6;pointer-events:none}
.b-text .ed:empty:not(:focus)::before{content:none}
.props{display:grid;grid-template-columns:110px 1fr;gap:6px 8px;align-items:center;font-size:14px;padding-bottom:16px;margin-bottom:16px;border-bottom:1px solid var(--line)}
.props label{color:var(--muted)}
.props select,.props input{font:inherit;font-size:14px;color:var(--text);background:none;border:1px solid transparent;border-radius:6px;padding:3px 6px}
.props select{cursor:pointer}
.props select:hover,.props input:hover,.props input:focus{border-color:var(--line);background:var(--card);outline:none}
.props option{background:var(--card);color:var(--text)}
.link-prop{display:flex;gap:6px;align-items:center;min-width:0}
.link-prop input{flex:1;min-width:0}
/* blocks */
.editor{margin-left:-52px;min-height:40px}
.block{display:grid;grid-template-columns:52px 1fr;align-items:start;position:relative;border-radius:6px}
.gutter{display:flex;justify-content:flex-end;gap:2px;padding-top:3px;padding-right:6px;opacity:0;transition:opacity .1s}
.block:hover .gutter,.block:focus-within .gutter{opacity:1}
.g-btn{border:0;background:none;color:var(--muted);width:22px;height:24px;border-radius:5px;cursor:pointer;font-size:16px;padding:0;display:inline-flex;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none}
.g-btn.drag{cursor:grab;font-size:13px;letter-spacing:-2px}
.g-btn:hover{background:var(--hover);color:var(--text)}
.bbody{display:flex;align-items:flex-start;gap:8px;min-width:0;padding:3px 0}
.ed{flex:1;min-width:0;outline:none;white-space:pre-wrap;word-break:break-word;min-height:1.6em}
.block.b-h1{margin-top:18px}
.block.b-h2{margin-top:10px}
.b-h1 .gutter{padding-top:9px}
.b-h2 .gutter{padding-top:6px}
.b-h1 .ed{font-size:27px;font-weight:700;line-height:1.3}
.b-h2 .ed{font-size:21px;font-weight:650;line-height:1.35}
.dot{width:16px;text-align:center;flex:none;font-size:18px;line-height:24px}
.chk{margin:5px 2px 0;width:16px;height:16px;accent-color:var(--accent);flex:none;cursor:pointer}
.done .ed{text-decoration:line-through;color:var(--muted)}
.b-quote .bbody{border-left:3px solid var(--text);padding-left:14px;margin:4px 0}
.b-quote .ed{font-size:16.5px}
.b-callout .bbody{background:var(--accent-soft);border-radius:8px;padding:12px 14px;margin:4px 0}
.b-callout .gutter{padding-top:12px}
.callout-ico{border:0;background:none;font-size:20px;line-height:1.2;cursor:pointer;padding:0}
.b-code .bbody{background:var(--code);border-radius:8px;padding:12px 14px;margin:4px 0}
.b-code .gutter{padding-top:12px}
.b-code .ed{font:13.5px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;tab-size:2}
hr{border:0;border-top:1px solid var(--line);width:100%;margin:11px 0}
.figure{margin:6px 0;width:100%}
.img-wrap{position:relative;display:inline-block;max-width:100%;vertical-align:top}
.img-wrap img{display:block;max-width:100%;border-radius:6px;cursor:zoom-in}
.w-s .img-wrap{max-width:260px}
.w-m .img-wrap{max-width:480px}
.media-tools{position:absolute;top:8px;right:8px;display:flex;gap:4px;opacity:0;transition:opacity .15s}
.img-wrap:hover .media-tools{opacity:1}
.media-tools .btn{background:rgba(255,255,255,.94);color:#222;border-color:transparent}
.caption{font-size:13.5px;color:var(--muted);outline:none;margin-top:6px;white-space:pre-wrap}
.uploader{flex:1;display:flex;align-items:center;gap:12px;border:1px dashed var(--line);background:var(--side);border-radius:10px;padding:14px 16px;cursor:pointer;margin:4px 0}
.uploader:hover{border-color:var(--accent)}
.uploader .up-txt{flex:1}
.up-ico{font-size:24px}
.filecard,.linkcard,.link-edit{flex:1;display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--card);min-width:0;margin:4px 0;flex-wrap:wrap}
.file-ico{font-size:22px}
.file-info{flex:1;min-width:0}
.file-name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.link-main{flex:1;display:flex;gap:10px;align-items:center;color:inherit;text-decoration:none;min-width:0}
.link-main:hover .link-title{text-decoration:underline}
.link-txt{display:flex;flex-direction:column;min-width:0}
.link-title{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.link-url{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.link-edit input{flex:1 1 180px;min-width:0;border:1px solid var(--line);border-radius:6px;padding:5px 8px;background:var(--bg);color:var(--text);font:inherit;font-size:14px;outline:none}
.link-edit input:focus{border-color:var(--accent)}
.drop-before{box-shadow:inset 0 2px 0 var(--accent)}
.drop-after{box-shadow:inset 0 -2px 0 var(--accent)}
.dragging{opacity:.4}
.empty-editor{color:var(--muted);padding:8px 52px;cursor:text}
.addbar{margin-top:28px;padding-top:14px;border-top:1px dashed var(--line);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.addbar .lbl{font-size:13px;color:var(--muted);margin-right:4px}
/* menus */
#menu,#pop{position:fixed;z-index:50;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.14);padding:6px;max-height:340px;overflow:auto;min-width:220px}
#menu[hidden],#pop[hidden]{display:none}
.menu-head{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:6px 8px 4px}
.menu-item{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;color:var(--text);font:inherit;font-size:14px;padding:5px 8px;border-radius:6px;cursor:pointer;text-align:left}
.menu-item.sel,.menu-item:hover{background:var(--hover)}
.menu-item.danger{color:var(--danger)}
.mi-ico{width:28px;height:28px;border:1px solid var(--line);border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex:none;background:var(--bg)}
.mi-hint{margin-left:auto;padding-left:12px;font-size:12px;color:var(--muted)}
.emoji-grid{display:grid;grid-template-columns:repeat(8,34px);gap:2px}
.emoji-grid button{border:0;background:none;font-size:20px;height:34px;border-radius:6px;cursor:pointer;padding:0}
.emoji-grid button:hover{background:var(--hover)}
.pop-row{display:flex;gap:6px;margin-top:8px}
.pop-row input{flex:1;min-width:0;border:1px solid var(--line);border-radius:6px;padding:4px 8px;background:var(--bg);color:var(--text);font:inherit;font-size:14px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 16px;border-radius:8px;font-size:14px;z-index:80;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
#toast.show{opacity:1}
#lightbox{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:70;cursor:zoom-out;padding:24px}
#lightbox img{max-width:100%;max-height:100%;border-radius:6px}
/* mobile */
@media (max-width:800px){
  #sidebar{position:fixed;left:0;top:0;z-index:40;transform:translateX(-100%);transition:transform .2s;box-shadow:0 0 30px rgba(0,0,0,.2)}
  #sidebar.open{transform:none}
  .menu-toggle{display:inline-flex}
  .home{padding:16px 16px 60px}
  .home h1{font-size:24px}
  .page{padding:20px 16px 120px}
  .title{font-size:30px}
  .props{grid-template-columns:76px 1fr}
  .topbar{padding:8px 12px}
  .editor{margin-left:-12px}
  .block{grid-template-columns:26px 1fr}
  .gutter{padding-right:4px}
  .gutter .g-btn:first-child{display:none}
  .empty-editor{padding:8px 12px}
  .cover{height:150px}
}
@media (hover:none){.gutter{opacity:.5}.head-tools,.cover-btns,.media-tools{opacity:1}}
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand">☀️ Soul Sunny Studio</div>
    <input class="search" id="search" type="search" placeholder="Search pages…" aria-label="Search pages">
    <nav id="nav"></nav>
    <div class="side-foot">
      <div class="row">
        <button class="btn small" id="exportBtn" title="Download a backup file of everything">Export</button>
        <button class="btn small" id="importBtn" title="Load a backup file">Import</button>
      </div>
      <div class="muted small">Saved in this browser. Export to back up.</div>
    </div>
  </aside>
  <main id="main"></main>
</div>
<div id="menu" hidden></div>
<div id="pop" hidden></div>
<div id="toast" role="status"></div>
<input type="file" id="filePicker" hidden>
<script>
'use strict';
const TYPES=['Idea','Site','App','Note'];
const TYPE_ICON={Idea:'💡',Site:'🌐',App:'📱',Note:'📝'};
const STATUSES=['Not started','In progress','Done','Paused'];
const EMOJIS='💡 🌐 📱 📝 ☀️ 🌻 🌈 ✨ 🔥 🚀 🎯 🎨 🎵 📚 🧠 💼 🛍️ 📦 🧩 🌱 🍀 🌙 ⭐ ❤️ 📌 📎 🗂️ 🖼️ 🎬 📷 ✏️ 🧪 ⚙️ 🔗 🏷️ 💰 📈 🗓️ ✅ 🧸'.split(' ');
const BLOCK_DEFS=[
  {type:'text',label:'Text',icon:'Aa',hint:'Plain writing'},
  {type:'h1',label:'Heading 1',icon:'H1',hint:'#'},
  {type:'h2',label:'Heading 2',icon:'H2',hint:'##'},
  {type:'bullet',label:'Bulleted list',icon:'•',hint:'-'},
  {type:'todo',label:'To-do',icon:'☐',hint:'[]'},
  {type:'quote',label:'Quote',icon:'❝',hint:'>'},
  {type:'callout',label:'Callout',icon:'💡',hint:'Highlight'},
  {type:'code',label:'Code',icon:'</>',hint:'Snippet'},
  {type:'image',label:'Image',icon:'🖼️',hint:'Upload / paste',kw:'photo picture'},
  {type:'file',label:'File',icon:'📎',hint:'PDF, zip, any file',kw:'attachment upload'},
  {type:'link',label:'Link',icon:'🔗',hint:'Website / app URL',kw:'bookmark url web'},
  {type:'divider',label:'Divider',icon:'—',hint:'Line',kw:'separator hr'},
];
const TEXTY=new Set(['text','h1','h2','bullet','todo','quote','callout','code']);
const ALL_TYPES=new Set(BLOCK_DEFS.map(d=>d.type));
const PH={text:"Write something, or type '/' for blocks",h1:'Heading 1',h2:'Heading 2',bullet:'List item',todo:'To-do',quote:'Quote',callout:'Write a callout',code:'Code'};
const MD=[[/^#\s/,'h1'],[/^##\s/,'h2'],[/^[-*]\s/,'bullet'],[/^\[\]\s/,'todo'],[/^>\s/,'quote']];
const MAX_FILE=50*1024*1024;

let pages=[],cur=null,query='',homeFilter='All',dragId=null,dropTarget=null,focusTitleNext=false;
const editingLinks=new Set();
const $=s=>document.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const newBlock=(type='text',extra={})=>({id:uid(),type,text:'',...extra});
const slug=s=>s.toLowerCase().replace(/\s+/g,'-');
const byUpdated=(a,b)=>b.updated-a.updated;
const fmtDate=t=>new Date(t).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
function fmtSize(n){if(!n)return '';const u=['B','KB','MB','GB'];let i=0;while(n>=1024&&i<u.length-1){n/=1024;i++}return (i?n.toFixed(1):n)+' '+u[i]}
function normUrl(u){u=String(u||'').trim();if(!u)return '';if(!/^[a-z][a-z0-9+.-]*:/i.test(u))u='https://'+u;return /^(https?|mailto):/i.test(u)?u:''}

function h(tag,attrs,...kids){
  const e=document.createElement(tag);
  for(const[k,v]of Object.entries(attrs||{})){
    if(v==null||v===false)continue;
    if(k==='class')e.className=v;
    else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);
    else e.setAttribute(k,v===true?'':v);
  }
  for(const k of kids.flat()){if(k==null||k===false)continue;e.append(k instanceof Node?k:document.createTextNode(k))}
  return e;
}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2800)}

/* ---------- storage (IndexedDB) ---------- */
const DB={
  db:null,
  open(){return new Promise((res,rej)=>{const r=indexedDB.open('soul-sunny-studio',1);r.onupgradeneeded=()=>r.result.createObjectStore('pages',{keyPath:'id'});r.onsuccess=()=>{this.db=r.result;res()};r.onerror=()=>rej(r.error)})},
  req(mode,fn){return new Promise((res,rej)=>{if(!this.db)return rej(new Error('Storage unavailable'));const r=fn(this.db.transaction('pages',mode).objectStore('pages'));r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})},
  all(){return this.req('readonly',s=>s.getAll())},
  put(p){return this.req('readwrite',s=>s.put(p))},
  del(id){return this.req('readwrite',s=>s.delete(id))},
};
const timers={};
function setSaved(t){const e=$('#saved');if(e)e.textContent=t}
function write(p){return DB.put(p).then(()=>setSaved('Saved')).catch(err=>{setSaved('Not saved');toast('Could not save: '+(err&&err.name==='QuotaExceededError'?'browser storage is full.':(err&&err.message||err)))})}
function save(p,delay=400){p.updated=Date.now();setSaved('Saving…');clearTimeout(timers[p.id]);timers[p.id]=setTimeout(()=>{delete timers[p.id];write(p)},delay)}
function flushAll(){for(const id of Object.keys(timers)){clearTimeout(timers[id]);delete timers[id];const p=pages.find(x=>x.id===id);if(p)write(p)}}
addEventListener('pagehide',flushAll);
document.addEventListener('visibilitychange',()=>{if(document.hidden)flushAll()});

function normalize(p){
  const blocks=(Array.isArray(p.blocks)?p.blocks:[]).filter(b=>b&&typeof b==='object'&&ALL_TYPES.has(b.type)).map(b=>{
    const o={...b,id:typeof b.id==='string'&&b.id?b.id:uid(),text:typeof b.text==='string'?b.text:''};
    if('src' in o&&!(typeof o.src==='string'&&o.src.startsWith('data:')))delete o.src;
    if('url' in o)o.url=normUrl(o.url);
    return o;
  });
  return {id:String(p.id),title:typeof p.title==='string'?p.title:'',icon:typeof p.icon==='string'?p.icon.slice(0,8):'',
    cover:typeof p.cover==='string'&&p.cover.startsWith('data:image/')?p.cover:null,
    type:TYPES.includes(p.type)?p.type:'Idea',status:STATUSES.includes(p.status)?p.status:'Not started',link:normUrl(p.link),
    blocks,created:+p.created||Date.now(),updated:+p.updated||Date.now()};
}

/* ---------- files ---------- */
const readURL=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(f)});
function pickFiles(accept,multiple,cb){const inp=$('#filePicker');inp.value='';inp.accept=accept||'';inp.multiple=!!multiple;inp.onchange=()=>{if(inp.files.length)cb([...inp.files])};inp.click()}
function dataURLtoBlob(u,forceType){const i=u.indexOf(',');const meta=u.slice(5,i);const mime=meta.split(';')[0]||'application/octet-stream';const isB64=/;base64/i.test(meta);const raw=isB64?atob(u.slice(i+1)):decodeURIComponent(u.slice(i+1));const arr=new Uint8Array(raw.length);for(let k=0;k<raw.length;k++)arr[k]=raw.charCodeAt(k);return new Blob([arr],{type:forceType||mime})}
const OPENABLE=/^(application\/pdf|image\/(png|jpe?g|gif|webp|avif|bmp)|text\/plain|audio\/|video\/)/i;
function download(b){const a=h('a',{href:URL.createObjectURL(dataURLtoBlob(b.src)),download:b.name||'download'});document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),10000)}
function openFile(b){const mime=b.src.slice(5,b.src.indexOf(',')).split(';')[0];if(!OPENABLE.test(mime)){download(b);return}const url=URL.createObjectURL(dataURLtoBlob(b.src));window.open(url,'_blank','noopener');setTimeout(()=>URL.revokeObjectURL(url),60000)}
function fileIcon(b){const m=b.mime||'';return m==='application/pdf'?'📕':/zip|rar|7z|tar/.test(m)?'🗜️':m.startsWith('audio/')?'🎵':m.startsWith('video/')?'🎬':m.startsWith('text/')?'📄':'📎'}

async function addFiles(files,index,replace){
  const p=cur;if(!p)return;
  let pos=index,first=true;
  for(const f of files){
    if(f.size>MAX_FILE){toast(`"${f.name}" is over 50 MB, skipped.`);continue}
    let src;try{src=await readURL(f)}catch{toast(`Could not read "${f.name}".`);continue}
    const type=f.type.startsWith('image/')?'image':'file';
    const data={src,name:f.name,size:f.size,mime:f.type||''};
    if(replace&&first&&p.blocks.includes(replace)){
      if(replace.type!==type)replace.text='';
      Object.assign(replace,{type},data);
      pos=p.blocks.indexOf(replace)+1;
    }else{p.blocks.splice(Math.min(pos,p.blocks.length),0,newBlock(type,data));pos++}
    first=false;
  }
  const last=p.blocks[p.blocks.length-1];
  if(!last||!TEXTY.has(last.type))p.blocks.push(newBlock());
  save(p);
  if(cur===p)renderBlocks();
}

/* ---------- routing ---------- */
function go(hash){$('#sidebar').classList.remove('open');closeMenu();closePop();if(location.hash===hash)route();else location.hash=hash}
function route(){
  const m=location.hash.match(/^#\/p\/(.+)$/);
  const p=m&&pages.find(x=>x.id===decodeURIComponent(m[1]));
  cur=p||null;
  if(cur)renderPage();else renderHome();
  renderSidebar();
  window.scrollTo(0,0);
}
addEventListener('hashchange',route);

function newPage(type){
  const now=Date.now();
  const p={id:uid(),title:'',icon:TYPE_ICON[type],cover:null,type,status:'Not started',link:'',blocks:[newBlock()],created:now,updated:now};
  pages.push(p);save(p,0);focusTitleNext=true;go('#/p/'+p.id);
}
function deletePage(p){
  if(!confirm(`Delete "${p.title||'Untitled'}"? This can't be undone.`))return;
  clearTimeout(timers[p.id]);delete timers[p.id];
  pages=pages.filter(x=>x!==p);
  DB.del(p.id).catch(()=>toast('Could not delete from storage.'));
  go('#/');
}

function matches(p){
  if(!query)return true;const q=query.toLowerCase();
  return (p.title||'').toLowerCase().includes(q)||(p.link||'').toLowerCase().includes(q)||p.blocks.some(b=>[b.text,b.name,b.url].some(s=>(s||'').toLowerCase().includes(q)));
}
function renderSidebar(){
  const nav=$('#nav');nav.innerHTML='';
  nav.append(h('button',{class:'nav-item'+(!cur?' active':''),onclick:()=>go('#/')},h('span',{},'🏠'),h('span',{class:'lbl'},'Home')));
  for(const t of TYPES){

    const sec=h('div',{class:'sec'},h('div',{class:'sec-head'},h('span',{},t+'s'),h('button',{class:'icon-btn',title:'New '+t,'aria-label':'New '+t,onclick:()=>newPage(t)},'+')));

}

/* ---------- page ---------- */
function makeEditable(el,onFiles){
  el.contentEditable='plaintext-only';
  if(el.contentEditable!=='plaintext-only')el.contentEditable='true';
  el.addEventListener('paste',e=>{
    const cd=e.clipboardData;if(!cd)return;
    e.preventDefault();
    const files=[...cd.files];
    if(files.length){if(onFiles)onFiles(files);return}
    document.execCommand('insertText',false,cd.getData('text/plain'));
  });
}
function renderPage(){
  const p=cur,m=$('#main');m.innerHTML='';

    h('div',{class:'crumbs'},menuToggle(),h('a',{href:'#/'},'Home'),h('span',{},'/'),h('span',{id:'crumb'},`${p.icon||''} ${p.title||'Untitled'}`.trim())),
    h('div',{class:'top-right'},h('span',{id:'saved',class:'muted'},'Saved'),h('button',{class:'btn ghost small danger',onclick:()=>deletePage(p)},'Delete page')));

    h('button',{class:'btn small',onclick:()=>{p.cover=null;save(p);renderPage()}},'Remove'))):null;

    !p.icon?h('button',{class:'btn ghost small',onclick:e=>emojiPicker(e.currentTarget,p)},'☺ Add icon'):null,

  const sel=(opts,val,on)=>h('select',{onchange:e=>on(e.target.value)},...opts.map(o=>h('option',{value:o,selected:o===val},o)));

  const props=h('div',{class:'props'},
    h('label',{},'Type'),sel(TYPES,p.type,v=>{if(p.icon===TYPE_ICON[p.type])p.icon=TYPE_ICON[v];p.type=v;save(p);renderPage();renderSidebar()}),
    h('label',{},'Status'),sel(STATUSES,p.status,v=>{p.status=v;save(p)}),

function pickCover(p){pickFiles('image/*',false,async fs=>{if(fs[0].size>MAX_FILE){toast('Image is over 50 MB.');return}p.cover=await readURL(fs[0]);save(p);renderPage()})}

function renderBlocks(){
  const ed=$('#editor');if(!ed||!cur)return;
  ed.innerHTML='';
  for(const b of cur.blocks)ed.append(blockEl(b));
  if(!cur.blocks.length)ed.append(h('div',{class:'empty-editor',onclick:()=>{const b=newBlock();cur.blocks.push(b);save(cur);renderBlocks();focusBlock(b.id,0)}},'Click here to write, or use the buttons below.'));
}
const edOf=id=>document.querySelector(`.block[data-id="${CSS.escape(id)}"] .ed`);
function focusBlock(id,pos){const ed=edOf(id);if(ed)setCaret(ed,pos)}
function caretOffset(ed){
  const s=getSelection();if(!s.rangeCount)return 0;const r=s.getRangeAt(0);
  if(!ed.contains(r.startContainer))return 0;
  const pre=document.createRange();pre.selectNodeContents(ed);pre.setEnd(r.startContainer,r.startOffset);return pre.toString().length;
}
function setCaret(ed,pos){
  ed.focus();const s=getSelection(),r=document.createRange();
  if(pos==='end'||pos==null){r.selectNodeContents(ed);r.collapse(false)}
  else{
    let n=pos,placed=false;const w=document.createTreeWalker(ed,NodeFilter.SHOW_TEXT);let node;
    while((node=w.nextNode())){if(n<=node.length){r.setStart(node,n);r.collapse(true);placed=true;break}n-=node.length}
    if(!placed){r.selectNodeContents(ed);r.collapse(pos===0)}
  }
  s.removeAllRanges();s.addRange(r);
}

function blockEl(b){
  const row=h('div',{class:'block b-'+b.type+(b.type==='image'?' w-'+(b.width||'l'):''),'data-id':b.id});
  const drag=h('span',{class:'g-btn drag',role:'button',tabindex:'0',title:'Drag to move · click for options',draggable:'true',
    onclick:e=>blockMenu(e.currentTarget,b),
    onkeydown:e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();blockMenu(e.currentTarget,b)}},
    ondragstart:e=>{dragId=b.id;e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain','');e.dataTransfer.setDragImage(row,10,10);row.classList.add('dragging')},
    ondragend:()=>{dragId=null;row.classList.remove('dragging');clearDrop()}},'⋮⋮');
  const gutter=h('div',{class:'gutter'},h('button',{class:'g-btn',title:'Add block below','aria-label':'Add block below',onclick:()=>plusBelow(b)},'+'),drag);
  const body=h('div',{class:'bbody'});
  if(TEXTY.has(b.type)){
    if(b.type==='todo'){
      body.append(h('input',{type:'checkbox',class:'chk',checked:!!b.checked,'aria-label':'Done',onchange:e=>{b.checked=e.target.checked;row.classList.toggle('done',b.checked);save(cur)}}));
      if(b.checked)row.classList.add('done');
    }
    if(b.type==='bullet')body.append(h('span',{class:'dot'},'•'));
    if(b.type==='callout')body.append(h('button',{class:'callout-ico',title:'Change icon',onclick:e=>emojiPicker(e.currentTarget,null,em=>{b.icon=em;save(cur);renderBlocks()})},b.icon||'💡'));
    const ed=h('div',{class:'ed','data-ph':PH[b.type]});
    ed.textContent=b.text;
    makeEditable(ed,files=>addFiles(files,cur.blocks.indexOf(b)+(b.text?1:0),b.text?null:b));
    wireText(ed,b);
    body.append(ed);
  }
  else if(b.type==='divider')body.append(h('hr'));
  else if(b.type==='image')body.append(b.src?imageView(b):uploader(b,'image'));
  else if(b.type==='file')body.append(b.src?fileView(b):uploader(b,'file'));
  else if(b.type==='link')body.append(b.url&&!editingLinks.has(b.id)?linkView(b):linkEdit(b));
  row.append(gutter,body);
  return row;
}

function wireText(ed,b){
  ed.addEventListener('input',e=>{
    if(!ed.textContent&&ed.innerHTML)ed.innerHTML='';
    b.text=ed.textContent;
    if(b.type==='text'&&e.inputType==='insertText'&&e.data===' '){
      const hit=MD.map(([re,t])=>[b.text.match(re),t]).find(([mm])=>mm&&caretOffset(ed)===mm[0].length);
      if(hit){b.text=b.text.slice(hit[0][0].length);b.type=hit[1];save(cur);renderBlocks();focusBlock(b.id,0);return}
    }
    if(b.text.startsWith('/')&&!b.text.includes('\n')&&b.text.length<=25)openSlash(b,ed,b.text.slice(1));
    else if(menu.open&&menu.slash)closeMenu(true);
    save(cur);
  });
  ed.addEventListener('keydown',e=>{
    if(menu.open&&menu.slash){
      if(e.key==='ArrowDown'){e.preventDefault();moveSel(1);return}
      if(e.key==='ArrowUp'){e.preventDefault();moveSel(-1);return}
      if(e.key==='Enter'){e.preventDefault();pickSel();return}
      if(e.key==='Escape'){e.preventDefault();closeMenu();return}
    }
    if(e.isComposing||e.keyCode===229)return;
    const i=cur.blocks.indexOf(b);
    if(e.key==='Enter'&&(e.shiftKey||(b.type==='code'&&!(e.metaKey||e.ctrlKey)))){e.preventDefault();document.execCommand('insertText',false,'\n');return}
    if(e.key==='Enter'){
      e.preventDefault();
      if(!b.text&&['bullet','todo','quote','callout'].includes(b.type)){b.type='text';save(cur);renderBlocks();focusBlock(b.id,0);return}
      const pos=caretOffset(ed),after=b.text.slice(pos);
      b.text=b.text.slice(0,pos);
      const nb=newBlock(b.type==='bullet'||b.type==='todo'?b.type:'text',{text:after});
      cur.blocks.splice(i+1,0,nb);save(cur);renderBlocks();focusBlock(nb.id,0);return;
    }
    if(e.key==='Backspace'&&getSelection().isCollapsed&&caretOffset(ed)===0){
      e.preventDefault();
      if(b.type!=='text'){b.type='text';save(cur);renderBlocks();focusBlock(b.id,0);return}
      const prev=cur.blocks[i-1];if(!prev)return;
      if(TEXTY.has(prev.type)){const len=prev.text.length;prev.text+=b.text;cur.blocks.splice(i,1);save(cur);renderBlocks();focusBlock(prev.id,len);return}
      if(!b.text){cur.blocks.splice(i,1);save(cur);renderBlocks()}
      return;
    }
    if(e.key==='ArrowUp'&&caretOffset(ed)===0){const pv=nearTexty(i,-1);if(pv){e.preventDefault();focusBlock(pv.id,'end')}}
    if(e.key==='ArrowDown'&&caretOffset(ed)===b.text.length){const nx=nearTexty(i,1);if(nx){e.preventDefault();focusBlock(nx.id,0)}}
  });
}
function nearTexty(i,dir){for(let k=i+dir;k>=0&&k<cur.blocks.length;k+=dir)if(TEXTY.has(cur.blocks[k].type))return cur.blocks[k];return null}

function imageView(b){

  cap.textContent=b.text||'';makeEditable(cap);
  cap.addEventListener('input',()=>{if(!cap.textContent)cap.innerHTML='';b.text=cap.textContent;save(cur)});
  cap.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault();const nb=newBlock();cur.blocks.splice(cur.blocks.indexOf(b)+1,0,nb);save(cur);renderBlocks();focusBlock(nb.id,0)}});
  const sizes={l:'Large',m:'Medium',s:'Small'},next={l:'m',m:'s',s:'l'};

}

function linkEdit(b){
  const url=h('input',{class:'link-input',type:'url',placeholder:'Paste a link and press Enter',value:b.url||'','aria-label':'Link URL'});
  const ttl=h('input',{type:'text',placeholder:'Title (optional)',value:b.text||'','aria-label':'Link title'});
  const done=()=>{const u=normUrl(url.value);if(!u){toast('That doesn’t look like a web link.');url.focus();return}b.url=u;b.text=ttl.value.trim();editingLinks.delete(b.id);save(cur);renderBlocks()};
  const key=e=>{if(e.key==='Enter'){e.preventDefault();done()}if(e.key==='Escape'){e.preventDefault();if(b.url){editingLinks.delete(b.id);renderBlocks()}else removeBlock(b)}};
  url.addEventListener('keydown',key);ttl.addEventListener('keydown',key);
  return h('div',{class:'link-edit'},h('span',{},'🔗'),url,ttl,h('button',{class:'btn small primary',onclick:done},'Save'));
}
function removeBlock(b){const i=cur.blocks.indexOf(b);if(i<0)return;cur.blocks.splice(i,1);save(cur);renderBlocks()}
function moveBlock(b,dir){const i=cur.blocks.indexOf(b),j=i+dir;if(j<0||j>=cur.blocks.length)return;[cur.blocks[i],cur.blocks[j]]=[cur.blocks[j],cur.blocks[i]];save(cur);renderBlocks()}

function convert(b,type,fromSlash){
  if(fromSlash)b.text='';
  const i=cur.blocks.indexOf(b);
  if(TEXTY.has(type)){b.type=type;save(cur);renderBlocks();focusBlock(b.id,'end');return}
  b.text='';delete b.src;
  if(type==='divider'){
    b.type='divider';let nx=cur.blocks[i+1];
    if(!nx||!TEXTY.has(nx.type)){nx=newBlock();cur.blocks.splice(i+1,0,nx)}
    save(cur);renderBlocks();focusBlock(nx.id,0);return;
  }
  if(type==='image'||type==='file'){b.type=type;save(cur);renderBlocks();pickFiles(type==='image'?'image/*':'',true,fs=>addFiles(fs,cur.blocks.indexOf(b)+1,b));return}
  if(type==='link'){b.type='link';b.url='';save(cur);renderBlocks();const inp=document.querySelector(`.block[data-id="${CSS.escape(b.id)}"] .link-input`);inp&&inp.focus()}
}
function addFromBar(type){
  const last=cur.blocks[cur.blocks.length-1];
  let b;
  if(last&&last.type==='text'&&!last.text)b=last;
  else{b=newBlock();cur.blocks.push(b)}
  if(type==='text'){save(cur);renderBlocks();focusBlock(b.id,0);return}
  convert(b,type,false);
}
function plusBelow(b){
  let nb=b;
  if(!(b.type==='text'&&!b.text)){nb=newBlock();cur.blocks.splice(cur.blocks.indexOf(b)+1,0,nb)}
  nb.text='/';save(cur);renderBlocks();
  const ed=edOf(nb.id);setCaret(ed,'end');openSlash(nb,ed,'',true);
}

/* ---------- menus ---------- */
const menu={open:false,slash:false,items:[],idx:0,blockId:null,fromPlus:false};
function placeAt(el,anchor){
  const r=anchor.getBoundingClientRect();el.hidden=false;
  const w=el.offsetWidth,ht=el.offsetHeight;
  el.style.left=Math.max(8,Math.min(r.left,innerWidth-w-8))+'px';
  let top=r.bottom+6;if(top+ht>innerHeight-8)top=Math.max(8,r.top-ht-6);
  el.style.top=top+'px';
}
function showMenu(anchor,items,opts={}){
  const el=$('#menu');el.innerHTML='';
  Object.assign(menu,{open:true,items:items.filter(x=>!x.heading),idx:0,slash:!!opts.slash,blockId:opts.blockId||null,fromPlus:!!opts.fromPlus});
  let k=0;
  for(const it of items){
    if(it.heading){el.append(h('div',{class:'menu-head'},it.heading));continue}
    el.append(h('button',{class:'menu-item'+(it.danger?' danger':''),'data-i':k++,onmousedown:e=>e.preventDefault(),onclick:()=>{closeMenu(true);it.action()}},
      h('span',{class:'mi-ico'},it.icon||''),h('span',{},it.label),it.hint?h('span',{class:'mi-hint'},it.hint):null));
  }
  placeAt(el,anchor);highlight();
}
function highlight(){document.querySelectorAll('#menu .menu-item').forEach(x=>{const on=+x.dataset.i===menu.idx;x.classList.toggle('sel',on);if(on)x.scrollIntoView({block:'nearest'})})}
function moveSel(d){const n=menu.items.length;menu.idx=(menu.idx+d+n)%n;highlight()}
function pickSel(){const it=menu.items[menu.idx];closeMenu(true);if(it)it.action()}
function closeMenu(picked){
  if(!menu.open)return;
  $('#menu').hidden=true;
  if(!picked&&menu.slash&&menu.fromPlus&&cur){
    const b=cur.blocks.find(x=>x.id===menu.blockId);
    if(b&&b.text==='/'){b.text='';const ed=edOf(b.id);if(ed)ed.innerHTML='';save(cur)}
  }
  menu.open=false;menu.slash=false;
}
function openSlash(b,ed,q,fromPlus){
  q=q.toLowerCase();
  const list=BLOCK_DEFS.filter(d=>(d.label+' '+d.type+' '+(d.kw||'')).toLowerCase().includes(q));
  if(!list.length){closeMenu(true);return}
  const keepPlus=menu.open&&menu.slash&&menu.blockId===b.id&&menu.fromPlus;
  showMenu(ed,[{heading:'Add a block'},...list.map(d=>({icon:d.icon,label:d.label,hint:d.hint,action:()=>convert(b,d.type,true)}))],{slash:true,blockId:b.id,fromPlus:fromPlus||keepPlus});
}
function blockMenu(anchor,b){
  const i=cur.blocks.indexOf(b),items=[];
  if(TEXTY.has(b.type)){items.push({heading:'Turn into'});for(const d of BLOCK_DEFS)if(TEXTY.has(d.type)&&d.type!==b.type)items.push({icon:d.icon,label:d.label,action:()=>convert(b,d.type,false)})}
  items.push({heading:'Actions'},
    {icon:'↑',label:'Move up',action:()=>moveBlock(b,-1)},
    {icon:'↓',label:'Move down',action:()=>moveBlock(b,1)},
    {icon:'⧉',label:'Duplicate',action:()=>{const c=JSON.parse(JSON.stringify(b));c.id=uid();cur.blocks.splice(i+1,0,c);save(cur);renderBlocks()}},
    {icon:'🗑',label:'Delete',danger:true,action:()=>removeBlock(b)});
  showMenu(anchor,items);
}
function closePop(){$('#pop').hidden=true}
function emojiPicker(anchor,page,cb){
  const pop=$('#pop');pop.innerHTML='';
  const set=em=>{closePop();if(cb)cb(em);else{page.icon=em;save(page);renderPage();renderSidebar()}};
  pop.append(h('div',{class:'emoji-grid'},...EMOJIS.map(em=>h('button',{onclick:()=>set(em)},em))));
  const custom=h('input',{type:'text',placeholder:'Or paste any emoji',maxlength:'8','aria-label':'Custom emoji'});
  custom.addEventListener('keydown',e=>{if(e.key==='Enter'&&custom.value.trim())set(custom.value.trim())});
  pop.append(h('div',{class:'pop-row'},custom,!cb&&page.icon?h('button',{class:'btn small',onclick:()=>{closePop();page.icon='';save(page);renderPage();renderSidebar()}},'Remove'):null));
  placeAt(pop,anchor);
}
function lightbox(src){const lb=h('div',{id:'lightbox',onclick:()=>lb.remove()},h('img',{src,alt:''}));document.body.append(lb)}

/* ---------- drag & drop ---------- */
function clearDrop(){document.querySelectorAll('.drop-before,.drop-after').forEach(x=>x.classList.remove('drop-before','drop-after'));dropTarget=null}
function wireDrop(editor){
  editor.addEventListener('dragover',e=>{
    const files=[...e.dataTransfer.types].includes('Files');
    if(!dragId&&!files)return;
    e.preventDefault();clearDrop();
    const row=e.target.closest('.block');
    if(row){const r=row.getBoundingClientRect(),before=e.clientY<r.top+r.height/2;row.classList.add(before?'drop-before':'drop-after');dropTarget={id:row.dataset.id,before}}
  });
  editor.addEventListener('dragleave',e=>{if(!editor.contains(e.relatedTarget))clearDrop()});
  editor.addEventListener('drop',e=>{
    const t=dropTarget;clearDrop();
    const files=[...e.dataTransfer.files];
    if(!dragId&&!files.length)return;
    e.preventDefault();e.stopPropagation();
    let idx=cur.blocks.length,target=null;
    if(t){target=cur.blocks.find(x=>x.id===t.id);idx=cur.blocks.indexOf(target)+(t.before?0:1)}
    if(files.length){
      const empty=target&&(target.type==='image'||target.type==='file')&&!target.src?target:null;
      addFiles(files,idx,empty);return;
    }
    const from=cur.blocks.findIndex(x=>x.id===dragId);if(from<0)return;
    const [blk]=cur.blocks.splice(from,1);if(from<idx)idx--;
    cur.blocks.splice(idx,0,blk);save(cur);renderBlocks();
  });
}
addEventListener('dragover',e=>{if([...e.dataTransfer.types].includes('Files'))e.preventDefault()});
addEventListener('drop',e=>{
  if(!e.dataTransfer.files.length)return;
  e.preventDefault();
  if(cur)addFiles([...e.dataTransfer.files],cur.blocks.length,null);else toast('Open a page first, then drop files on it.');
});
document.addEventListener('paste',e=>{
  if(!cur)return;const t=e.target;
  if(t.closest&&t.closest('[contenteditable],input,textarea'))return;
  const files=[...(e.clipboardData?.files||[])];if(!files.length)return;
  e.preventDefault();
  const row=document.activeElement?.closest?.('.block');
  const b=row&&cur.blocks.find(x=>x.id===row.dataset.id);
  if(b&&(b.type==='image'||b.type==='file')&&!b.src)addFiles(files,cur.blocks.indexOf(b)+1,b);
  else addFiles(files,cur.blocks.length,null);
});
document.addEventListener('mousedown',e=>{
  if(menu.open&&!$('#menu').contains(e.target))closeMenu();
  if(!$('#pop').hidden&&!$('#pop').contains(e.target))closePop();
  const sb=$('#sidebar');if(sb.classList.contains('open')&&!sb.contains(e.target)&&!e.target.closest('.menu-toggle'))sb.classList.remove('open');
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){const lb=$('#lightbox');if(lb)lb.remove();closePop();if(menu.open&&!menu.slash)closeMenu()}});
addEventListener('resize',()=>{closeMenu(true);closePop()});

/* ---------- search / backup ---------- */
$('#search').addEventListener('input',e=>{query=e.target.value.trim();renderSidebar();if(!cur)renderHome()});
$('#exportBtn').addEventListener('click',()=>{
  flushAll();
  const data={app:'soul-sunny-studio',version:1,exportedAt:new Date().toISOString(),pages};
  const a=h('a',{href:URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'})),download:`soul-sunny-backup-${new Date().toISOString().slice(0,10)}.json`});
  document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),10000);
  toast(`Exported ${pages.length} page${pages.length===1?'':'s'}.`);
});
$('#importBtn').addEventListener('click',()=>pickFiles('application/json,.json',false,async fs=>{
  let arr;
  try{const d=JSON.parse(await fs[0].text());arr=Array.isArray(d)?d:d&&d.pages;if(!Array.isArray(arr))throw 0}
  catch{toast('That file isn’t a Soul Sunny backup.');return}
  let n=0;
  for(const raw of arr){
    if(!raw||typeof raw.id!=='string'||!Array.isArray(raw.blocks))continue;
    const p=normalize(raw);
    try{await DB.put(p)}catch{toast('Storage full, import stopped.');break}
    const i=pages.findIndex(x=>x.id===p.id);if(i>=0)pages[i]=p;else pages.push(p);n++;
  }
  toast(`Imported ${n} page${n===1?'':'s'}.`);route();
}));

/* ---------- start ---------- */
function welcomePage(){
  const now=Date.now();
  const B=(type,text,extra)=>newBlock(type,{text,...extra});
  return {id:uid(),title:'Welcome to your studio',icon:'☀️',cover:null,type:'Note',status:'Not started',link:'',created:now,updated:now,blocks:[
    B('callout','This is your space to collect ideas, websites and apps. Everything saves automatically.',{icon:'🌻'}),
    B('h2','How it works'),
    B('bullet',"Type / on an empty line to add a block (heading, to-do, image, file, link…)."),
    B('bullet','Hover a line and click + to add below, or drag ⋮⋮ to move it. Click ⋮⋮ for more options.'),
    B('bullet','Paste or drop images and files anywhere on a page.'),
    B('bullet','Shortcuts: "# " heading, "- " list, "[] " to-do, "> " quote.'),
    B('todo','Try checking this box'),
    B('h2','Good to know'),
    B('text','Your pages are stored in this browser on this device. Use Export (bottom of the sidebar) to save a backup file, and Import to load it on another device.'),
  ]};
}
(async()=>{
  try{await DB.open();pages=(await DB.all()).map(normalize)}
  catch{toast('Browser storage is unavailable — changes won’t be saved.')}
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
  if(!pages.length&&DB.db){const w=welcomePage();pages.push(w);write(w)}
  route();
})();
</script>
